name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: Repository Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Python Unit Tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Task Catalog Generation
        run: |
          python scripts/generate_task_catalog.py
          git diff --exit-code -- docs/task-catalog.md

      - name: Markdown Links/Style
        run: |
          python scripts/check_markdown_links.py
          git diff --check

      - name: Secret Scan
        run: python scripts/check_secrets.py
